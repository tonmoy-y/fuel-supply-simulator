# Official simulator image (per Integration Guide) + this platform.
#   docker compose up -d --build            -> official simulator + app
#   docker compose --profile mock up -d --build mock-simulator app-mock   -> OFFLINE fallback using the repo's mock
services:
  simulator-api:
    image: asifmahmoud414/bup-fuel-supply-simulator:1.0.0
    environment:
      SIMULATION_SPEED: ${SIMULATION_SPEED:-8}
      TICK_MINUTES: ${TICK_MINUTES:-15}
      SIMULATOR_START_MODE: ${SIMULATOR_START_MODE:-paused}
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/v1/health',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      SIM_BASE_URL: http://simulator-api:8000
      AUTOPILOT: ${AUTOPILOT:-false}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-}
      ENABLE_ADMIN_PROXY: ${ENABLE_ADMIN_PROXY:-false}
    ports: ["8080:8080"]
    depends_on:
      simulator-api:
        condition: service_started     # app tolerates a slow/unavailable simulator (degraded mode)
    restart: unless-stopped

  # ---- offline fallback: contract-faithful mock of the simulator (NOT the official image) ----
  mock-simulator:
    profiles: ["mock"]
    build: .
    command: ["uvicorn", "mocksim.server:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: { SIMULATOR_START_MODE: paused }
    ports: ["8001:8000"]
  app-mock:
    profiles: ["mock"]
    build: .
    environment: { SIM_BASE_URL: "http://mock-simulator:8000" }
    ports: ["8081:8080"]
    depends_on: [mock-simulator]
